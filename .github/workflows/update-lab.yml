name: Update Sandemon's Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-lab.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: update-lab
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.LAB_HISTORY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch-github-data.py
      - name: Compute lab state
        run: python scripts/compute-lab-state.py
      - name: Generate lab scene
        run: python scripts/generate-lab-svg.py
      - name: Commit changed outputs
        run: |
          git add assets/lab.svg data/
          if git diff --cached --quiet; then
            echo "Lab outputs unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update lab status"
          git push
